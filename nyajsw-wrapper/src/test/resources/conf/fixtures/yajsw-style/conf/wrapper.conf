#*****************************************************************************
# Service configuration in the style of a YAJSW wrapper.conf.
#
# Written from scratch for the nyajsw test suite; it is not taken from YAJSW or
# from any product. It uses the layout real files tend to have: Windows paths
# with doubled backslashes, CRLF line endings, an include, a continued value,
# variables (one used before the line that defines it), commented-out keys,
# trailing blanks, and keys nyajsw plans, ignores or does not support.
# It lives in <home>\conf, like the configuration of an installed service.
#*****************************************************************************

#-----------------------------------------------------------------------------
# Application home: the parent of the directory holding this file
#-----------------------------------------------------------------------------
wrapper.working.dir=..

#-----------------------------------------------------------------------------
# Java process
#-----------------------------------------------------------------------------
# JVM of the application; JAVA_HOME comes from the environment
wrapper.java.command=${JAVA_HOME}\\bin\\java

# YAJSW's own bootstrap class; nyajsw starts the main class directly
wrapper.java.mainclass=org.rzo.yajsw.app.WrapperJVMMain
wrapper.java.app.mainclass=com.example.inventory.InventoryServer

wrapper.java.classpath.1=lib\\*.jar
wrapper.java.classpath.2=conf
wrapper.java.classpath.3=${wrapper.working.dir}\\plugins\\*
#wrapper.java.classpath.4=lib\\optional\\*.jar

! JVM options; more of them come from the included file
wrapper.java.additional.1=-Xss512k   
wrapper.java.additional.2=-Dfile.encoding=UTF-8
wrapper.java.additional.3=-Dinventory.mode=${inventory_mode}
wrapper.java.additional.6=-Dinventory.data="C:\\Program Files\\Inventory\\data"

wrapper.java.initmemory=128
wrapper.java.maxmemory=512

wrapper.app.parameter.1=--config
wrapper.app.parameter.2=conf\\inventory.properties

inventory_mode=production
wrapper.app.env.INVENTORY_MODE=${inventory_mode}

# Not used here; the application runs as the service account
wrapper.app.account=

#-----------------------------------------------------------------------------
# Windows service
#-----------------------------------------------------------------------------
wrapper.ntservice.name=InventoryServer
wrapper.ntservice.displayname=Inventory Server
wrapper.ntservice.description=Keeps the inventory of the example warehouse \
    up to date and answers stock queries
wrapper.ntservice.starttype=DELAY_START
wrapper.ntservice.dependency.1=Tcpip
wrapper.ntservice.account=CORP\\svc-inventory
wrapper.ntservice.password=Not-A-Real-Password-1
wrapper.ntservice.interactive=false

#-----------------------------------------------------------------------------
# Lifecycle
#-----------------------------------------------------------------------------
wrapper.control=TIGHT
wrapper.on_exit.0=SHUTDOWN
wrapper.on_exit.default=RESTART
wrapper.restart.delay=5
wrapper.max_failed_invocations=3
wrapper.startup.timeout=60
wrapper.shutdown.timeout=45
wrapper.ping.interval=30
wrapper.ping.timeout=60

#-----------------------------------------------------------------------------
# Logging (the YYYYMMDD token is kept literally; its rolling meaning is P4)
#-----------------------------------------------------------------------------
wrapper.logfile=log\\wrapper_YYYYMMDD.log
wrapper.logfile.maxsize=10m
wrapper.logfile.maxfiles=10
wrapper.logfile.loglevel=INFO
wrapper.console.loglevel=INFO

#-----------------------------------------------------------------------------
# Desktop features nyajsw does not support; they only produce warnings
#-----------------------------------------------------------------------------
wrapper.tray=false
wrapper.tray.port=15002

#-----------------------------------------------------------------------------
# Settings shared with the other services of the same installation
#-----------------------------------------------------------------------------
include = memory.conf

# Optional local overrides; this installation has none. YAJSW reads this line
# as a comment; nyajsw reads it as an optional include (Tanuki format, D7).
#include local-overrides.conf
