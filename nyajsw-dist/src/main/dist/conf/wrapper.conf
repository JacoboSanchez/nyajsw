# nyajsw configuration template
#
# Copy this file, set the lines that are not commented out, and uncomment what you need. An
# existing YAJSW wrapper.conf can be used instead: nyajsw reads the same keys and warns about the
# ones it does not support. It stops only on the few that ignoring would change behaviour (such as
# wrapper.app.account) and on Groovy or keystore expressions in ${...}. docs/COMPATIBILITY.md
# lists every key with its status.
#
# Format: key=value, one per line; lines starting with # or ! are comments. A line ending in a
# \ continues on the next line. ${name} inserts another key's value, ${env:NAME} an
# environment variable and ${sys:name} a system property of the wrapper JVM. Write paths with
# forward slashes: a backslash before a blank or one of \ , " ' # = : ! is an escape character.
# Relative paths of the wrapper (log file, pid files) are relative to this file's directory;
# relative paths of the application (jar, classpath) are relative to wrapper.working.dir.
#
# A commented-out value is the key's default where it has a fixed one, else an example.

#------------------------------------------------------------------------------------------------
# Application
#------------------------------------------------------------------------------------------------

# The Java executable that runs the application: any Java 8 or later. Give it with its directory.
# When not set, the application runs on the wrapper's own Java (21 or later).
#wrapper.java.command=C:/Program Files/Java/jdk-17/bin/java.exe

# The working directory of the application. The default is this file's directory; ".." is the
# installation directory when this file is in its conf folder.
wrapper.working.dir=..

# Either a main class with a classpath ...
wrapper.java.app.mainclass=com.example.Main
# ... or an executable jar instead of the main class.
#wrapper.java.app.jar=lib/app.jar

# Classpath entries, in order of their numbers; * and ? are wildcards within a folder, and a
# whole ** segment matches folders at any depth.
wrapper.java.classpath.1=lib/*.jar
#wrapper.java.classpath.2=classes

# Program arguments, one argument per key.
#wrapper.app.parameter.1=--port
#wrapper.app.parameter.2=8080

# JVM options and system properties, one option per key: "-Xms1g -Xmx2g" in one value would be
# passed as a single argument. Quotes around a whole option, or around what follows its first =,
# are removed.
#wrapper.java.additional.1=-Dfile.encoding=UTF-8
#wrapper.java.additional.2=-Dapp.home="C:/My Application"

# Heap of the application in MB (-Xms and -Xmx).
#wrapper.java.initmemory=256
#wrapper.java.maxmemory=1024

# Entries of the application's java.library.path.
#wrapper.java.library.path.1=lib/native

# Environment variables of the application; an empty value removes an inherited variable.
#wrapper.app.env.APP_PROFILE=production

# The wrapper's temporary directory, where JNA unpacks its native library. Set it when the
# account's own temporary directory is not writable or antivirus software blocks DLLs there.
#wrapper.tmp.path=../tmp

#------------------------------------------------------------------------------------------------
# Restarts and timeouts (seconds)
#------------------------------------------------------------------------------------------------

# What to do when the application exits: RESTART, SHUTDOWN (end the wrapper) or STOP. A code
# without its own wrapper.on_exit.<code> gets wrapper.on_exit.default.
#wrapper.on_exit.default=SHUTDOWN
#wrapper.on_exit.0=SHUTDOWN
#wrapper.on_exit.1=RESTART

# Pause before a restart.
#wrapper.restart.delay=5

# The wrapper gives up after this many failed invocations in a row. An invocation fails when it
# cannot be started, is not ready within wrapper.startup.timeout or ends before it has run for
# wrapper.successful_invocation_time.
#wrapper.max_failed_invocations=5
#wrapper.successful_invocation_time=60

# Wait before the first start of the application.
#wrapper.startup.delay=0

# Time the application has to become ready (0: no limit).
#wrapper.startup.timeout=30

# Time the application has to stop gracefully before it is terminated; the stop may also take
# wrapper.jvm_exit.timeout on top.
#wrapper.shutdown.timeout=30
#wrapper.jvm_exit.timeout=15

# How the lifetimes of the wrapper and the application are tied: TIGHT (each ends with the other),
# LOOSE, APPLICATION or WRAPPER; see docs/COMPATIBILITY.md.
#wrapper.control=TIGHT

# Files the wrapper writes its own process id and the application's process id to.
#wrapper.pidfile=wrapper.pid
#wrapper.java.pidfile=application.pid

#------------------------------------------------------------------------------------------------
# Agent, readiness and liveness (nyajsw extensions; see docs/probes.md)
#------------------------------------------------------------------------------------------------

# The agent is a small -javaagent the wrapper loads into the application JVM. It answers the
# wrapper's heartbeat and stops the application with System.exit(0), so that its shutdown hooks
# run. Turn it off when the application must not get an extra JVM option.
#wrapper.agent.enabled=true

# While the agent is in use and wrapper.liveness.type is not set, the agent's heartbeat is the
# liveness check, with the timing of the wrapper.liveness.* keys below. YAJSW's heartbeat keys
# also apply to it when written: wrapper.ping.interval is its interval unless
# wrapper.liveness.interval is written too, and wrapper.ping.timeout how long the application may
# stay silent before it counts as hung. Writing either changes the timing even with the value
# YAJSW defaults to; 0 for either turns the heartbeat off.

# Readiness: probes that must all pass before the service reports that it is running. Types:
# process, tcp, http, log, file, command, agent; several are separated by commas.
#wrapper.readiness.type=process
#wrapper.readiness.interval=1
#wrapper.readiness.tcp.host=127.0.0.1
#wrapper.readiness.tcp.port=8080
#wrapper.readiness.http.url=http://127.0.0.1:8080/health
#wrapper.readiness.http.status=200-399
#wrapper.readiness.http.timeout=5
#wrapper.readiness.log.pattern=Started .* in [0-9.]+ seconds
#wrapper.readiness.log.file=logs/application.log
#wrapper.readiness.file.path=work/ready.flag
#wrapper.readiness.command=bin/check.cmd
#wrapper.readiness.command.timeout=10

# Liveness: probes checked while the application runs, with the settings of the readiness keys
# above. After wrapper.liveness.failures failed checks in a row the application is terminated and
# then restarted (RESTART) or the wrapper ends (SHUTDOWN).
#wrapper.liveness.type=http
#wrapper.liveness.interval=10
#wrapper.liveness.failures=3
#wrapper.liveness.action=RESTART

# How the application is stopped: the listed strategies in order, then terminate. The default is
# agent,terminate while the agent is in use, else terminate.
#wrapper.stop.strategy=agent,terminate

#------------------------------------------------------------------------------------------------
# Logging
#------------------------------------------------------------------------------------------------

# The wrapper's log, which also holds the application's output. The default is wrapper.log in this
# file's directory; a blank value turns the file off. YYYYMMDD in the name is the date.
#wrapper.logfile=../log/wrapper.log
#wrapper.logfile.loglevel=INFO
#wrapper.logfile.format=LPTM

# Rolling: at a size (such as 10M; 0 turns it off), keeping wrapper.logfile.maxfiles rolled files
# (all when not set). Roll modes: SIZE, JVM (also at each start of the application), WRAPPER
# (also at each start of the wrapper), DATE (a file per day; the name needs YYYYMMDD, and
# wrapper.logfile.maxdays says how many days are kept), NONE.
#wrapper.logfile.maxsize=0
#wrapper.logfile.maxfiles=10
#wrapper.logfile.rollmode=SIZE

# Console output in console mode.
#wrapper.console.loglevel=INFO
#wrapper.console.format=PM

# More detail for troubleshooting.
#wrapper.debug=false

#------------------------------------------------------------------------------------------------
# Windows service
#------------------------------------------------------------------------------------------------

# The service's name, the name the Services console shows and its description.
wrapper.ntservice.name=example
wrapper.ntservice.displayname=Example application
wrapper.ntservice.description=Runs the example application under nyajsw.

# AUTO_START, DELAYED_AUTO_START, DEMAND_START or DISABLED.
#wrapper.ntservice.starttype=AUTO_START

# Services that must be running before this one starts.
#wrapper.ntservice.dependency.1=Tcpip

# The account the service runs as; LocalSystem when not set. A local account is written
# .\name. The password is never logged.
#wrapper.ntservice.account=.\appuser
#wrapper.ntservice.password=

# The wrapper's own JVM in the service: Java 21 or later. The default is the javaw.exe of the Java
# that installs the service. JVM options of the wrapper JVM, one per key.
#wrapper.ntservice.java.command=C:/Program Files/Java/jdk-21/bin/javaw.exe
#wrapper.ntservice.additional.1=-Xmx64m
